# Test-only MariaDB for the WordPress integration suite.
#
# This compose file is used by the local `tests/Integration` harness and by the
# GitHub Actions integration job. It provisions a throwaway MariaDB server with
# deterministic, NON-PRODUCTION credentials. None of these values are used (or
# valid) outside of testing; do not reuse them for any real environment.
#
# PHPUnit runs on the host (not inside a container) and connects to MariaDB via
# the published host port below, matching the DB_HOST default in
# tests/Integration/wp-tests-config.php (127.0.0.1:3307). Override any value by
# exporting the corresponding WP_DB_* / MARIADB_* variable before bringing the
# stack up.
#
#   docker compose -f docker-compose.integration.yml up -d --wait
#   docker compose -f docker-compose.integration.yml down -v   # destroy data
#
name: cast-integration

services:
  mariadb:
    # MariaDB 10.11 is an LTS release (supported upstream to at least 2028).
    # It comfortably exceeds WordPress 7.1's MariaDB requirement (>= 10.3) and,
    # unlike rolling releases (10.6/11.x feature series), receives years of
    # stable point releases — the low-risk choice for a CI test database.
    # WordPress 7.1 is pinned in composer.json (roots/wordpress-no-content 7.1);
    # 10.11 is fully supported by the bundled wp-db mysqlnd client.
    image: mariadb:10.11
    container_name: cast-integration-mariadb
    restart: "no"
    environment:
      # MariaDB image initialises a DB + user on first volume creation.
      MARIADB_DATABASE: ${WP_DB_NAME:-cast_test}
      MARIADB_USER: ${WP_DB_USER:-cast_test}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-cast_test}
      # Test-only superuser for provisioning; deliberately NOT a production root.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-cast_test_root}
    ports:
      # Publish on a non-default host port to avoid colliding with a host MySQL.
      - "${WP_DB_EXT_PORT:-127.0.0.1:3307}:3306"
    healthcheck:
      # healthcheck.sh ships with the official image.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      # Named volume keeps the test DB across `up`/`down`; remove with `down -v`.
      - cast_mariadb_data:/var/lib/mysql

volumes:
  cast_mariadb_data:
